name: changelog gate probe
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Changelog for PR
        uses: Automattic/vip-actions/ai-changelog-generator@6bf9fde7ac8acce516488384357e3e6fb28669cf
        with:
          openai_api_key: dummy-value-not-a-real-key
          user_login: octocat
          comment_id: ''
          post_comment: 'false'
